<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HusVagt Partner — Opgaveindbakke (demo)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#F5F7F7;color:#12211F;margin:0;padding:24px 16px}
  main{max-width:720px;margin:0 auto}
  h1{margin:0;font-size:24px}
  .sub{color:#5C6B69;margin:4px 0 18px}
  .card{background:#fff;border:1px solid #E1E7E6;border-radius:14px;padding:18px;margin-bottom:14px}
  .badge{border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;white-space:nowrap}
  .ctx{margin-top:12px;padding:12px;border-radius:10px;background:#F5F7F7;border-left:4px solid #E8A33D;font-size:14px}
  button{background:#0E7C7B;color:#fff;border:none;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px;margin-right:8px}
  button.reject{background:#fff;color:#D64545;border:1.5px solid #D64545}
  .empty{color:#5C6B69}
  a{color:#0E7C7B;font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:start;gap:10px}
  small{color:#5C6B69}
</style>
</head>
<body>
<main>
  <h1>🔧 HusVagt Partner <span style="font-weight:400;color:#5C6B69">(demo)</span></h1>
  <p class="sub">Opgaveindbakke — Østermann &amp; Knopp VVS · <a href="index.html">← forside</a></p>
  <div id="list"></div>
</main>
<script>
const KEY="husvagt-demo:jobs";
const NEXT={requested:[["accepted","Acceptér"],["cancelled","Afvis"]],accepted:[["scheduled","Planlæg besøg"]],scheduled:[["done","Markér udført"]]};
const LABEL={requested:"Ny",accepted:"Accepteret",scheduled:"Planlagt",done:"Udført",cancelled:"Annulleret"};
const TRIAGE={KRITISK_NU:"KRITISK",UNDERSOEG:"UNDERSØG",SANDSYNLIG_STOEJ:"STØJ"};
function jobs(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(j){localStorage.setItem(KEY,JSON.stringify(j))}
function setStatus(id,st){const j=jobs();const x=j.find(a=>a.id===id);if(x)x.status=st;save(j);render()}
function render(){
  const j=jobs();
  const el=document.getElementById("list");
  if(j.length===0){el.innerHTML='<p class="empty">Ingen opgaver endnu. Åbn <a href="app/">appen</a>, udløs en alarm og book en håndværker — så lander opgaven her.</p>';return}
  el.innerHTML=j.map(x=>`
    <article class="card">
      <div class="row">
        <div><strong>${x.homeName}</strong><div><small>${x.address}, ${x.city}</small></div></div>
        <span class="badge" style="background:${x.status==="requested"?"#E8A33D22":"#0E7C7B18"};color:${x.status==="requested"?"#B07A17":"#0E7C7B"}">${LABEL[x.status]||x.status}</span>
      </div>
      ${x.note?`<p style="margin:10px 0 0;font-size:15px">${x.note}</p>`:""}
      ${x.alertTitle?`<div class="ctx"><strong>📟 Sensorkontekst${x.sensorContextShared?" (delt med samtykke)":""}</strong><br>${x.alertTitle} · ${x.value??""}${x.unit??""} · triage: ${TRIAGE[x.triage]||x.triage||""}</div>`:""}
      ${!x.sensorContextShared&&x.alertTitle?`<p><small>🔒 Kunden har ikke delt sensordata.</small></p>`:""}
      <div style="margin-top:14px;display:flex;align-items:center">
        ${(NEXT[x.status]||[]).map(([to,label])=>`<button class="${to==='cancelled'?'reject':''}" onclick="setStatus('${x.id}','${to}')">${label}</button>`).join("")}
        <small style="margin-left:auto">${new Date(x.createdAt).toLocaleString("da-DK")}</small>
      </div>
    </article>`).join("");
}
render();
setInterval(render,3000);
</script>
</body>
</html>
